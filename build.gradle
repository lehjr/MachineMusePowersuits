def secondaryJar(SourceSet sourceSet, String title) {
    return tasks.named(sourceSet.jarTaskName, Jar) {
        duplicatesStrategy = DuplicatesStrategy.FAIL
        archiveClassifier.set(sourceSet.name)
        from(sourceSet.output)
        if (!title.isEmpty()) {
            archiveFileName.set("${title}-${project.version}.jar")
        }
        manifest.attributes(getManifestAttributes(title.isEmpty() ? 'ModularPowersuits' : title))
        // For when the stuff is added back
//        manifest.attributes(
//                getManifestAttributes(title.isEmpty() ? 'ModularPowersuits' : title)
//                        + ['MixinConfigs': 'powersuits.mixins.json']
//        )
    }
}

