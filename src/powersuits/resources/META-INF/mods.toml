modLoader="javafml"
loaderVersion="${loader_version_range}"
issueTrackerURL="https://github.com/lehjr/MachineMusePowersuits/issues"
license="${mod_license}"

[[mods]]
    modId="powersuits"
    version="${mod_version}"
    displayName="MachineMuse's Modular Powersuits"
    displayURL="https://github.com/lehjr/MachineMusePowersuits"
    authors="MachineMuse, lehjr"
    credits="Icons by WaterCandle, Modeling by SebK, Special thanks to TextureTurtle"
    logoFile="logo.png"
    description='''
A mod which adds modular power armor, power tool, and a tinker table to configure them. Uses FE (Foreg Energy), EU (IndustrialCraft 2) or RF (Thermal Expansion 4).
'''
[[accessTransformers]]
    file="META-INF/accesstransformer.cfg"

[[mixins]]
    config="powersuits.mixins.json"

[[dependencies.powersuits]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version}"
    side="BOTH"

[[dependencies.powersuits]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version}"
    side="BOTH"

[[dependencies.powersuits]]
    modId="numina"
    mandatory=true
    versionRange="[${mod_version},)"
    ordering="AFTER"
    side="BOTH"